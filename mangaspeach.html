<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Manga Speech Balloon - Auto Mic Start</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    #container { position: relative; width: 100vw; height: 100vh; }
    
    video {
      width: 100%; height: 100%; object-fit: cover;
      transform: scaleX(-1);
    }
    
    #status-panel {
      display: block;
      position: absolute; top: 10px; left: 10px;
      background: rgba(0, 0, 0, 0.8); color: #0f0;
      padding: 15px; font-family: monospace; font-size: 16px;
      z-index: 9999; border-radius: 8px;
    }

    .balloon {
      display: none; 
      position: absolute;
      box-sizing: border-box;
      background: #fff;
      border: 3px solid #000;
      border-radius: 50% / 50%;
      font-family: 'Comic Sans MS', 'ヒラギノ丸ゴ ProN', sans-serif;
      font-weight: bold;
      color: #000;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
      z-index: 100;
      writing-mode: vertical-rl;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease-in-out;
      opacity: 1;
    }

    #speech-text { max-height: 100%; max-width: 100%; line-height: 1.5; word-break: break-word; }

    .balloon.right-side { transform: translate(25%, -115%); }
    .balloon.right-side::before {
      content: ""; position: absolute; bottom: -35px; left: 25%;
      border-width: 35px 25px 0 0; border-style: solid; border-color: #000 transparent transparent transparent;
    }
    .balloon.right-side::after {
      content: ""; position: absolute; bottom: -31px; left: 25%; margin-left: 3px;
      border-width: 32px 22px 0 0; border-style: solid; border-color: #fff transparent transparent transparent;
    }

    .balloon.left-side { transform: translate(-125%, -115%); }
    .balloon.left-side::before {
      content: ""; position: absolute; bottom: -35px; right: 25%;
      border-width: 35px 0 0 25px; border-style: solid; border-color: #000 transparent transparent transparent;
    }
    .balloon.left-side::after {
      content: ""; position: absolute; bottom: -31px; right: 25%; margin-right: 3px;
      border-width: 32px 0 0 22px; border-style: solid; border-color: #fff transparent transparent transparent;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <div id="status-panel">⏳ カメラとAIを準備中...</div>
    <div id="speech-balloon" class="balloon">
      <span id="speech-text">（話しかけてください）</span>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('video');
    const balloonElement = document.getElementById('speech-balloon');
    const textElement = document.getElementById('speech-text');
    const statusPanel = document.getElementById('status-panel');

    // --- 音声認識 ---
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognitionActive = false;

    if (window.SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'ja-JP';

      recognition.onstart = () => { recognitionActive = true; };
      recognition.onend = () => { 
        recognitionActive = false; 
        // 切れたら自動で再起動を試みる
        try { recognition.start(); } catch(e) {}
      };
      
      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        
        if (transcript.trim() !== "") {
          textElement.textContent = transcript;
        }
      };
      
      // ★起動時に自動実行する関数
      function startMic() {
        try {
          recognition.start();
        } catch(e) {
          console.log("マイクの自動起動待ち");
        }
      }

      // 自動起動を試みる
      startMic();

      // もしブラウザにブロックされた時の保険（クリックまたはキー入力で起動）
      window.addEventListener('click', startMic);
      window.addEventListener('keydown', startMic);
    } else {
      alert("お使いのブラウザは音声認識に対応していません。Google Chromeをご利用ください。");
    }

    // --- MediaPipe FaceMesh ---
    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

    let hideTimeout = null;
    let isBalloonVisible = false;
    const HIDE_DELAY_MS = 1500; 

    faceMesh.onResults((results) => {
      const micStatus = recognitionActive ? "🎤ON" : "🎤OFF (画面をクリックしてください)";

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const upperLip = landmarks[13], lowerLip = landmarks[14];
        const distance = Math.abs(upperLip.y - lowerLip.y);
        
        statusPanel.innerHTML = `✅ AI稼働中<br>👤 顔: 認識中<br>👄 口: ${distance.toFixed(4)}<br>${micStatus}`;

        const mouthX = (1 - ((upperLip.x + lowerLip.x) / 2)) * window.innerWidth;
        const mouthY = ((upperLip.y + lowerLip.y) / 2) * window.innerHeight;
        balloonElement.style.left = mouthX + 'px';
        balloonElement.style.top = mouthY + 'px';

        const faceHeight = Math.abs(landmarks[152].y - landmarks[10].y) * window.innerHeight;
        const faceWidth = Math.abs(landmarks[454].x - landmarks[234].x) * window.innerWidth;
        const balloonW = faceWidth * 1.3;
        const balloonH = faceHeight * 1.4;
        balloonElement.style.width = balloonW + 'px';
        balloonElement.style.height = balloonH + 'px';
        balloonElement.style.padding = `${balloonH * 0.1}px ${balloonW * 0.15}px`;
        balloonElement.style.fontSize = Math.max(16, faceHeight * 0.09) + 'px';

        if (mouthX < window.innerWidth / 2) {
          balloonElement.className = 'balloon right-side';
        } else {
          balloonElement.className = 'balloon left-side';
        }

        if (distance > 0.015) {
          isBalloonVisible = true;
          balloonElement.style.display = 'flex';
          balloonElement.style.opacity = '1';
          if (hideTimeout !== null) {
            clearTimeout(hideTimeout);
            hideTimeout = null;
          }
        } else {
          if (isBalloonVisible && hideTimeout === null) {
            hideTimeout = setTimeout(() => {
              balloonElement.style.opacity = '0';
              setTimeout(() => { balloonElement.style.display = 'none'; }, 200); 
              isBalloonVisible = false;
              hideTimeout = null;
            }, HIDE_DELAY_MS);
          }
        }
      } else {
        statusPanel.innerHTML = `✅ AI稼働中<br>❌ 顔: 探しています...<br>${micStatus}`;
        balloonElement.style.display = 'none';
        isBalloonVisible = false;
        if (hideTimeout !== null) {
          clearTimeout(hideTimeout);
          hideTimeout = null;
        }
      }
    });

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => { await faceMesh.send({image: videoElement}); },
      width: 1280, height: 720
    });
    
    cameraUtils.start().catch(err => {
      console.error("Camera Error:", err);
      statusPanel.innerHTML = `<span style="color:red;">🚨 カメラ起動エラー: ${err.message}</span>`;
    });
  </script>
</body>
</html>
