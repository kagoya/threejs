<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Finger Drawing</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js for 3D rendering and drawing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- MediaPipe libraries for Hand Tracking and Camera -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* Color Palette UI on the left side */
        #palette {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }
        .color-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s, border-color 0.2s;
        }
        .color-btn.active { 
            transform: scale(1.2); 
            border-color: white; 
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        /* Loading Screen Overlay */
        #loading {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #111;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="spinner"></div>
        <h1 class="text-2xl font-bold tracking-wider">Starting AR Paint...</h1>
        <p class="mt-4 text-gray-400 text-center px-4 max-w-md">
            Please allow camera access. The AI models are loading, which might take a few moments.
        </p>
    </div>

    <!-- Hidden Video Element for MediaPipe input and Three.js background -->
    <video id="input_video" class="hidden" autoplay playsinline></video>

    <!-- Interactive Color Palette -->
    <div id="palette">
        <!-- Data attributes hold the hex color for Three.js -->
        <div class="color-btn" style="background-color: #ef4444;" data-color="0xef4444" id="btn-red"></div>
        <div class="color-btn" style="background-color: #22c55e;" data-color="0x22c55e" id="btn-green"></div>
        <div class="color-btn" style="background-color: #3b82f6;" data-color="0x3b82f6" id="btn-blue"></div>
        <div class="color-btn" style="background-color: #ffffff;" data-color="0xffffff" id="btn-white"></div>
        <div class="color-btn" style="background-color: #000000;" data-color="0x000000" id="btn-black"></div>
    </div>

    <!-- Instructions Overlay (Bottom) -->
    <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-10 w-11/12 max-w-2xl pointer-events-none">
        <div class="bg-black/60 backdrop-blur-sm border border-white/20 rounded-2xl p-4 text-white shadow-2xl flex flex-col md:flex-row justify-around items-center gap-4 text-sm md:text-base">
            <div class="flex items-center gap-2">
                <span class="text-2xl">☝️</span>
                <span><strong>Draw:</strong> Point index finger</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-2xl">🎨</span>
                <span><strong>Color:</strong> Touch palette</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-2xl">👐</span>
                <span><strong>Clear:</strong> Open both hands</span>
            </div>
        </div>
    </div>

    <!-- Container for Three.js Canvas -->
    <div id="canvas-container"></div>

<script>
    // --- Application State & Config ---
    const PEN_RADIUS = 6;
    let currentColor = 0xef4444; // Default to Red
    let isDrawing = false;
    let lastPoint = null;

    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // Orthographic camera maps 1:1 with screen pixels for easy 2D-like drawing
    let camera, renderer;
    function initThreeJS() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera = new THREE.OrthographicCamera(-w/2, w/2, h/2, -h/2, 0.1, 1000);
        camera.position.z = 10;

        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);
    }
    initThreeJS();

    // Group to hold all drawn strokes so they can be cleared easily
    const drawnObjects = new THREE.Group();
    scene.add(drawnObjects);

    // Indicator (The colored circle tracking the index finger tip)
    const indicatorMat = new THREE.MeshBasicMaterial({ color: currentColor });
    const indicatorGeo = new THREE.SphereGeometry(PEN_RADIUS * 1.5, 32, 32);
    const indicatorMesh = new THREE.Mesh(indicatorGeo, indicatorMat);
    indicatorMesh.position.z = 1;
    indicatorMesh.visible = false; // Hidden until hand is detected
    scene.add(indicatorMesh);

    // Webcam Background Setup
    const videoElement = document.getElementById('input_video');
    const videoTexture = new THREE.VideoTexture(videoElement);
    // Mirror the video horizontally to act like a mirror
    videoTexture.wrapS = THREE.RepeatWrapping;
    videoTexture.repeat.x = -1;
    videoTexture.center.set(0.5, 0.5);
    videoTexture.minFilter = THREE.LinearFilter;
    
    const bgGeometry = new THREE.PlaneGeometry(window.innerWidth, window.innerHeight);
    const bgMaterial = new THREE.MeshBasicMaterial({ map: videoTexture, depthWrite: false });
    const bgMesh = new THREE.Mesh(bgGeometry, bgMaterial);
    bgMesh.position.z = -10; // Send to back
    scene.add(bgMesh);

    // Handle Window Resize
    window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        camera.left = -w / 2;
        camera.right = w / 2;
        camera.top = h / 2;
        camera.bottom = -h / 2;
        camera.updateProjectionMatrix();
        
        bgMesh.geometry.dispose();
        bgMesh.geometry = new THREE.PlaneGeometry(w, h);
    });

    // --- Gesture Recognition Helpers ---
    // Calculate distance between two landmarks
    const getDist = (lm1, lm2) => Math.hypot(lm1.x - lm2.x, lm1.y - lm2.y);
    
    // Check if hand is making a pointing gesture (index up, others down)
    const isPointing = (lm) => {
        // Compare distances from finger tips to wrist (landmark 0)
        // vs finger PIP joints to wrist to determine if extended or folded
        const indexExtended = getDist(lm[0], lm[8]) > getDist(lm[0], lm[6]);
        const middleFolded = getDist(lm[0], lm[12]) < getDist(lm[0], lm[10]);
        const ringFolded = getDist(lm[0], lm[16]) < getDist(lm[0], lm[14]);
        const pinkyFolded = getDist(lm[0], lm[20]) < getDist(lm[0], lm[18]);
        
        return indexExtended && middleFolded && ringFolded && pinkyFolded;
    };

    // Check if hand is fully open (all fingers extended)
    const isHandOpen = (lm) => {
        return getDist(lm[0], lm[8]) > getDist(lm[0], lm[6]) && // Index
               getDist(lm[0], lm[12]) > getDist(lm[0], lm[10]) && // Middle
               getDist(lm[0], lm[16]) > getDist(lm[0], lm[14]) && // Ring
               getDist(lm[0], lm[20]) > getDist(lm[0], lm[18]);    // Pinky
    };

    // --- Drawing Functions ---
    // Draw a continuous thick line using spheres (joints) and cylinders (segments)
    function addLineSegment(p1, p2, color) {
        const material = new THREE.MeshBasicMaterial({ color: color });
        
        // Add a sphere at the end point for smooth rounded caps
        const sphereGeo = new THREE.SphereGeometry(PEN_RADIUS, 16, 16);
        const sphere = new THREE.Mesh(sphereGeo, material);
        sphere.position.copy(p2);
        drawnObjects.add(sphere);

        // Connect p1 and p2 with a cylinder if p1 exists (not the first point)
        if (p1) {
            const distance = p1.distanceTo(p2);
            if (distance > 0.1) {
                const cylinderGeo = new THREE.CylinderGeometry(PEN_RADIUS, PEN_RADIUS, distance, 16);
                const cylinder = new THREE.Mesh(cylinderGeo, material);
                
                // Position midway between the two points
                cylinder.position.copy(p1).lerp(p2, 0.5);
                
                // Orient the cylinder to face the direction of the line segment
                cylinder.quaternion.setFromUnitVectors(
                    new THREE.Vector3(0, 1, 0),
                    p2.clone().sub(p1).normalize()
                );
                drawnObjects.add(cylinder);
            }
        }
    }

    // Clear all drawn lines
    function clearCanvas() {
        while (drawnObjects.children.length > 0) { 
            const child = drawnObjects.children[0];
            drawnObjects.remove(child); 
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
        }
    }

    // --- Palette Logic ---
    function updateColor(colorHex, btnId) {
        currentColor = colorHex;
        indicatorMat.color.setHex(currentColor); // Update indicator color
        
        // Update UI Active State
        document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
        if(btnId) {
            document.getElementById(btnId).classList.add('active');
        }
    }
    updateColor(currentColor, 'btn-red'); // Set initial state

    // Check if the screen coordinates overlap with any color button
    function checkPaletteCollision(screenX, screenY) {
        const btns = document.querySelectorAll('.color-btn');
        btns.forEach(btn => {
            const rect = btn.getBoundingClientRect();
            // Add a small padding (hitbox tolerance)
            const padding = 20;
            if (screenX >= rect.left - padding && screenX <= rect.right + padding &&
                screenY >= rect.top - padding && screenY <= rect.bottom + padding) {
                
                const hex = parseInt(btn.getAttribute('data-color'));
                if (currentColor !== hex) {
                    updateColor(hex, btn.id);
                }
            }
        });
    }

    // --- MediaPipe Hands Integration ---
    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});
    
    hands.setOptions({
        maxNumHands: 2,           // Need 2 hands to check for the "clear" gesture
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
        // Hide loading screen on first successful frame
        const loader = document.getElementById('loading');
        if(loader && loader.style.display !== 'none') {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }

        indicatorMesh.visible = false; // Hide by default each frame

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            
            // Feature 3: Check for Clear Gesture (Both Hands Fully Open)
            if (results.multiHandLandmarks.length === 2) {
                if (isHandOpen(results.multiHandLandmarks[0]) && isHandOpen(results.multiHandLandmarks[1])) {
                    clearCanvas();
                    lastPoint = null;
                    isDrawing = false;
                    return; // Skip drawing logic this frame to prioritize clearing
                }
            }

            // For drawing, we track the primary hand (index 0)
            const landmarks = results.multiHandLandmarks[0];
            const indexTip = landmarks[8];

            // 1. Map MediaPipe normalized coords [0,1] to Screen Pixels
            // Note: MediaPipe X is mirrored relative to our video texture, so we invert it (1 - x)
            const screenX = (1 - indexTip.x) * window.innerWidth;
            const screenY = indexTip.y * window.innerHeight;

            // Map Screen Pixels to Three.js Orthographic Coordinates
            const threeX = screenX - window.innerWidth / 2;
            const threeY = window.innerHeight / 2 - screenY;
            const currentPos = new THREE.Vector3(threeX, threeY, 0);

            // 2. Feature 5: Update the Indicator (Colored Circle)
            indicatorMesh.position.copy(currentPos);
            indicatorMesh.visible = true;

            // 3. Feature 4: Check if finger is over the Color Palette
            checkPaletteCollision(screenX, screenY);

            // 4. Feature 2: Drawing Logic (Point with Index Finger)
            if (isPointing(landmarks)) {
                if (!isDrawing) {
                    isDrawing = true;
                    addLineSegment(null, currentPos, currentColor); // Start point (dot)
                } else {
                    if (lastPoint && lastPoint.distanceTo(currentPos) > 2) { 
                        // Threshold to prevent microscopic segments
                        addLineSegment(lastPoint, currentPos, currentColor);
                    }
                }
                lastPoint = currentPos.clone();
            } else {
                // Not pointing -> lift pen
                isDrawing = false;
                lastPoint = null;
            }
        } else {
            // No hands detected -> lift pen
            isDrawing = false;
            lastPoint = null;
        }
    });

    // Initialize Camera and feed to MediaPipe
    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 1280,
        height: 720
    });
    cameraUtils.start();

    // --- Main Render Loop ---
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    
    // Wait for page load before starting animation
    window.onload = function() {
        animate();
    };

</script>
</body>
</html>
