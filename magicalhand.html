<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Hand Stars</title>
    
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- MediaPipe Hands and Camera Utils for hand tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent pull-to-refresh on mobile */
        }

        /* Container for overlapping video and canvas */
        .immersive-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Webcam video feed */
        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cover whole screen */
            z-index: 1;
            /* Flip video horizontally so it acts like a mirror */
            transform: scaleX(-1);
        }

        /* Three.js canvas */
        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Let clicks pass through to UI */
        }

        /* Loading Overlay */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: opacity 0.5s ease;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fde047;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Vertical Slider Styles for Mobile */
        input[type=range][orient=vertical] {
            appearance: slider-vertical;
            -webkit-appearance: slider-vertical;
            width: 12px;
            height: 150px;
            cursor: pointer;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="immersive-container">
        <!-- Video element for MediaPipe processing and background -->
        <video id="webcam-video" autoplay playsinline></video>
        <!-- Canvas for Three.js rendering -->
        <canvas id="three-canvas"></canvas>
        
        <!-- Mobile Friendly Floating UI Controls (Left Aligned, Adjusted height) -->
        <div id="controls-container" class="fixed bottom-16 left-6 flex items-end gap-6 z-10 pointer-events-auto">
            
            <!-- Size Control -->
            <div class="flex flex-col items-center gap-3">
                <div id="size-panel" class="hidden bg-black/60 backdrop-blur-md p-4 rounded-2xl border border-white/20 flex-col items-center shadow-xl">
                    <div id="size-val" class="text-yellow-400 text-sm font-bold mb-3">0.05</div>
                    <input type="range" orient="vertical" id="size-slider" min="0.01" max="0.2" step="0.01" value="0.05" class="accent-yellow-400">
                </div>
                <button onclick="togglePanel('size-panel')" class="bg-black/60 backdrop-blur-md px-4 py-3 rounded-full border border-white/20 text-white text-sm font-bold shadow-lg whitespace-nowrap active:scale-95 transition-transform hover:bg-black/80">サイズ</button>
            </div>

            <!-- Quantity Control -->
            <div class="flex flex-col items-center gap-3">
                <div id="qty-panel" class="hidden bg-black/60 backdrop-blur-md p-4 rounded-2xl border border-white/20 flex-col items-center shadow-xl">
                    <div id="qty-val" class="text-yellow-400 text-sm font-bold mb-3">3</div>
                    <input type="range" orient="vertical" id="qty-slider" min="1" max="15" step="1" value="3" class="accent-yellow-400">
                </div>
                <button onclick="togglePanel('qty-panel')" class="bg-black/60 backdrop-blur-md px-4 py-3 rounded-full border border-white/20 text-white text-sm font-bold shadow-lg whitespace-nowrap active:scale-95 transition-transform hover:bg-black/80">量</button>
            </div>

            <!-- Gravity Control -->
            <div class="flex flex-col items-center gap-3">
                <div id="gravity-panel" class="hidden bg-black/60 backdrop-blur-md p-4 rounded-2xl border border-white/20 flex-col items-center shadow-xl">
                    <div id="gravity-val" class="text-yellow-400 text-sm font-bold mb-3">0.005</div>
                    <input type="range" orient="vertical" id="gravity-slider" min="-0.02" max="0.02" step="0.001" value="0.005" class="accent-yellow-400">
                </div>
                <button onclick="togglePanel('gravity-panel')" class="bg-black/60 backdrop-blur-md px-4 py-3 rounded-full border border-white/20 text-white text-sm font-bold shadow-lg whitespace-nowrap active:scale-95 transition-transform hover:bg-black/80">重力</button>
            </div>

        </div>

        <!-- Loading UI -->
        <div id="loading-overlay">
            <div class="spinner mb-4"></div>
            <h1 class="text-2xl font-bold tracking-wide">魔法の準備中...</h1>
            <p class="text-gray-300 mt-2 text-center max-w-md">
                カメラのアクセスを許可してください。(Please allow camera access)
            </p>
        </div>
    </div>

    <script>
        // --- UI Logic ---
        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            // Toggle between Tailwind's 'hidden' and 'flex'
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                panel.classList.add('flex');
            } else {
                panel.classList.add('hidden');
                panel.classList.remove('flex');
            }
        }

        const sizeSlider = document.getElementById('size-slider');
        const qtySlider = document.getElementById('qty-slider');
        const gravitySlider = document.getElementById('gravity-slider');
        
        const sizeVal = document.getElementById('size-val');
        const qtyVal = document.getElementById('qty-val');
        const gravityVal = document.getElementById('gravity-val');

        sizeSlider.addEventListener('input', (e) => sizeVal.textContent = e.target.value);
        qtySlider.addEventListener('input', (e) => qtyVal.textContent = e.target.value);
        gravitySlider.addEventListener('input', (e) => gravityVal.textContent = e.target.value);

        // --- 1. Three.js Setup ---
        const canvas = document.getElementById('three-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();

        // Setup Perspective Camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 20;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 2. Star Particle System ---
        const particles = [];
        
        // Create glowing radial gradient texture for soft-edged stars
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            // Core is bright white, fading out to the particle's assigned color via Three.js blending
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const glowTexture = createGlowTexture();
        
        // Finger configuration mapping specific colors
        const FINGERS = [
            { name: 'Thumb',  tip: 4,  joint: 3,  pip: 2,  color: 0xff3333 }, // Red/Pink
            { name: 'Index',  tip: 8,  joint: 7,  pip: 6,  color: 0x33ffff }, // Cyan
            { name: 'Middle', tip: 12, joint: 11, pip: 10, color: 0x33ff33 }, // Green
            { name: 'Ring',   tip: 16, joint: 15, pip: 14, color: 0xffff33 }, // Yellow
            { name: 'Pinky',  tip: 20, joint: 19, pip: 18, color: 0xff33ff }  // Magenta
        ];

        // Base materials to clone from (improves performance over creating new materials blindly)
        const baseMaterials = {};
        FINGERS.forEach(finger => {
            baseMaterials[finger.color] = new THREE.SpriteMaterial({ 
                map: glowTexture,
                color: finger.color,
                transparent: true,
                opacity: 1.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
        });

        // Spawn a star
        function spawnStar(x, y, dirX, dirY, colorHex, baseSize) {
            // Clone material to independently animate opacity per particle
            const material = baseMaterials[colorHex].clone();
            const star = new THREE.Sprite(material);
            
            star.position.set(x, y, 0);
            
            // Initial scale base on the 'サイズ' slider with slight randomness
            const initialScale = (Math.random() * 0.5 + 0.5) * (baseSize * 25);
            star.scale.set(initialScale, initialScale, 1);

            // Normalize the direction vector
            const length = Math.sqrt(dirX * dirX + dirY * dirY);
            const nx = length > 0 ? dirX / length : 0;
            const ny = length > 0 ? dirY / length : 0;

            // Speed of the particle emission
            const speed = Math.random() * 0.15 + 0.05;

            // Add slight random spread to form a cone matching the finger direction
            const spreadAngle = (Math.random() - 0.5) * 0.6; // radians
            const cosA = Math.cos(spreadAngle);
            const sinA = Math.sin(spreadAngle);
            
            // Final directional velocity based on finger joint -> fingertip + spread
            const finalDx = (nx * cosA - ny * sinA) * speed;
            const finalDy = (nx * sinA + ny * cosA) * speed;

            star.userData = {
                velocity: new THREE.Vector3(finalDx, finalDy, 0),
                baseScale: initialScale,
                life: 1.0, // Lifespan from 1.0 down to 0.0
                decay: Math.random() * 0.015 + 0.01, // Speed of fading
                sparkleOffset: Math.random() * Math.PI * 2, // Random offset for sparkling sine wave
                sparkleSpeed: Math.random() * 5 + 10 // Speed of the sparkle oscillation
            };

            scene.add(star);
            particles.push(star);
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;
            const gravity = parseFloat(gravitySlider.value); // Get real-time gravity

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                
                // 1. Apply Gravity to the Y velocity
                // In Three.js, positive Y is UP. Positive gravity pulls DOWN (subtraction).
                p.userData.velocity.y -= gravity * 0.1; // Multiplier to soften per-frame impact

                // Update Position
                p.position.add(p.userData.velocity);
                
                // Reduce life
                p.userData.life -= p.userData.decay;
                
                // 2. Opacity Fade & Sparkle
                // Base fade decreases linearly over life
                const baseOpacity = Math.max(0, p.userData.life);
                // Sparkle sine wave creates a pulsing opacity multiplier
                const sparklePhase = time * p.userData.sparkleSpeed + p.userData.sparkleOffset;
                const sparkleMultiplier = 0.5 + 0.5 * Math.sin(sparklePhase); // Fluctuates between 0 and 1
                
                // Final opacity combined
                p.material.opacity = baseOpacity * (0.4 + 0.6 * sparkleMultiplier);
                
                // 3. Keep size mostly constant, only shrinking slightly at the very end
                let currentScale = p.userData.baseScale;
                if (p.userData.life < 0.1) {
                    currentScale *= (p.userData.life * 10); // Quick shrink right before dying
                }
                p.scale.set(currentScale, currentScale, 1);

                // 4. Memory Management: Properly dispose of dead particles
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    p.material.dispose(); // Free up cloned material memory
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }
        animate(); 

        // --- 3. MediaPipe Integration ---
        const videoElement = document.getElementById('webcam-video');
        const loadingOverlay = document.getElementById('loading-overlay');
        
        let videoWidth = 0;
        let videoHeight = 0;

        // Check if hand is generally open
        function isHandOpen(landmarks) {
            const wrist = landmarks[0];
            let extendedFingers = 0;

            for (let f of FINGERS) {
                const tip = landmarks[f.tip];
                const pip = landmarks[f.pip];

                // Simple check: is fingertip further from wrist than the middle joint?
                const distTip = Math.hypot(tip.x - wrist.x, tip.y - wrist.y, tip.z - wrist.z);
                const distPip = Math.hypot(pip.x - wrist.x, pip.y - wrist.y, pip.z - wrist.z);

                if (distTip > distPip) {
                    extendedFingers++;
                }
            }
            // Require at least 4 fingers extended to consider the hand "open"
            return extendedFingers >= 4;
        }

        // Map MediaPipe (0..1) to Three.js World coordinates 
        function mapTo3DWorld(x, y) {
            const wW = window.innerWidth;
            const wH = window.innerHeight;
            
            // Calculate object-fit: cover constraints
            const scale = Math.max(wW / videoWidth, wH / videoHeight);
            const renderW = videoWidth * scale;
            const renderH = videoHeight * scale;
            
            const offsetX = (wW - renderW) / 2;
            const offsetY = (wH - renderH) / 2;

            // Mirror flip X (because CSS transforms scaleX(-1) visually)
            const flippedX = 1.0 - x;

            const px = offsetX + flippedX * renderW;
            const py = offsetY + y * renderH;

            // Normalize Device Coordinates (NDC)
            const ndcX = (px / wW) * 2 - 1;
            const ndcY = -(py / wH) * 2 + 1;

            // World coords at Z=0 based on camera projection
            const vFov = camera.fov * Math.PI / 180;
            const visibleHeight = 2 * Math.tan(vFov / 2) * camera.position.z;
            const visibleWidth = visibleHeight * camera.aspect;

            return { 
                x: ndcX * (visibleWidth / 2), 
                y: ndcY * (visibleHeight / 2) 
            };
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
            if (loadingOverlay.style.opacity !== '0') {
                loadingOverlay.style.opacity = '0';
                setTimeout(() => loadingOverlay.style.display = 'none', 500);
                videoWidth = videoElement.videoWidth;
                videoHeight = videoElement.videoHeight;
            }
            
            if (results.multiHandLandmarks) {
                const targetSize = parseFloat(sizeSlider.value);
                const targetQty = parseInt(qtySlider.value);

                for (const landmarks of results.multiHandLandmarks) {
                    if (isHandOpen(landmarks)) {
                        
                        // Process each finger
                        for (let f of FINGERS) {
                            const tip = landmarks[f.tip];
                            const joint = landmarks[f.joint]; // DIP joint (or PIP for thumb)
                            
                            const tipW = mapTo3DWorld(tip.x, tip.y);
                            const jointW = mapTo3DWorld(joint.x, joint.y);
                            
                            // Vector from joint to tip determines emission direction
                            // Note: mapTo3DWorld handles standard 3D mapping where +Y is up.
                            const dirX = tipW.x - jointW.x;
                            const dirY = tipW.y - jointW.y;

                            // Emit 'targetQty' amount of stars per finger continuously per frame
                            for(let i = 0; i < targetQty; i++) {
                                spawnStar(tipW.x, tipW.y, dirX, dirY, f.color, targetSize);
                            }
                        }
                    }
                }
            }
        });

        // Initialize Camera
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        cameraUtils.start().catch((err) => {
            console.error(err);
            loadingOverlay.innerHTML = `
                <h1 class="text-2xl font-bold text-red-500">Camera Unavailable</h1>
                <p class="mt-2 text-center text-white">Please check camera permissions.</p>
            `;
        });
    </script>
</body>
</html>
